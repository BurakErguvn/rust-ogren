name: "Rust Öğren"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust:
    name: Sunucu, tr-check ve çeviri doğrulaması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Çeviri doğrulaması (tr-check)
        run: cargo run -q -p tr-check
      - name: Clippy
        run: cargo clippy -p server -p tr-check --all-targets -- -D warnings
      - name: Testler
        run: cargo test -p server -p tr-check

  web:
    name: Arayüz (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker imajı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İmajı derle
        run: docker build -t rust-ogren-tr:ci .
